name: Hardware support request
description: A sensor is missing or wrong on your machine
labels: [hardware]
body:
  - type: textarea
    id: report
    attributes:
      label: Hardware report
      description: Paste the output of `scripts/hw-report.sh`.
      render: text
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: Which values are missing or wrong?
    validations:
      required: true
