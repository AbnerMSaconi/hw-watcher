<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.abnermsaconi.HwWatcher"/>
    <allow send_destination="io.github.abnermsaconi.HwWatcher"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.abnermsaconi.HwWatcher"
           send_interface="io.github.abnermsaconi.HwWatcher1"
           send_member="Sample"/>
    <allow send_destination="io.github.abnermsaconi.HwWatcher"
           send_interface="io.github.abnermsaconi.HwWatcher1"
           send_member="Capabilities"/>
    <allow receive_sender="io.github.abnermsaconi.HwWatcher"/>
  </policy>
</busconfig>
